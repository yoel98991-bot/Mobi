<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AquaVita - App Chofer</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #f1f5f9; --surface: #ffffff;
            --primary: #0284c7; --primary-active: #0369a1;
            --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --success: #10b981; --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- PANTALLAS --- */
        .screen { display: none !important; flex-direction: column; height: 100%; width: 100%; overflow-y: auto; padding-bottom: 80px; }
        .screen.active { display: flex !important; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- HEADER MÓVIL --- */
        .mobile-header { background: #0f172a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .mobile-header h1 { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; margin: 0;}
        .route-badge { background: rgba(255,255,255,0.2); font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; }

        /* --- CONTENEDORES --- */
        .container { padding: 20px; }
        
        /* --- TARJETA DE STOCK --- */
        .stock-card { background: var(--primary); color: white; border-radius: 20px; padding: 20px; text-align: left; margin-bottom: 20px; box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4); }
        .stock-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; opacity: 0.9; margin-bottom: 5px; }
        .stock-number { font-size: 3.5rem; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .stock-number span { font-size: 1.2rem; font-weight: 600; display: block; margin-top: -5px; opacity: 0.9; }

        /* --- FORMULARIO RÁPIDO (3 CLICS) --- */
        .card { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid var(--border); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .input-field { width: 100%; background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 15px; font-size: 1rem; font-weight: 600; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: var(--primary); background: white; }

        /* Stepper Cantidad */
        .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 15px; border: 2px solid var(--border); padding: 5px; }
        .stepper-btn { width: 50px; height: 50px; border-radius: 12px; background: white; border: none; font-size: 1.5rem; font-weight: 800; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; }
        .stepper-btn:active { transform: scale(0.95); background: var(--bg); }
        .stepper-value { font-size: 2rem; font-weight: 900; color: var(--text-main); flex: 1; text-align: center; }

        /* Métodos de Pago (Grid) */
        .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pay-btn { background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 15px 10px; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .pay-btn i { font-size: 1.5rem; }
        .pay-btn.selected { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
        
        .pay-efectivo.selected { background: #dcfce7; border-color: #22c55e; color: #15803d; }
        .pay-qr.selected { background: #e0f2fe; border-color: #0ea5e9; color: #0369a1; }
        .pay-transf.selected { background: #f3e8ff; border-color: #a855f7; color: #7e22ce; }
        .pay-credito.selected { background: #fef3c7; border-color: #f59e0b; color: #b45309; }

        /* Botón Enorme Registrar */
        .btn-massive { width: 100%; background: var(--success); color: white; border: none; border-radius: 15px; padding: 20px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); cursor: pointer; transition: 0.2s; }
        .btn-massive:active { transform: scale(0.98); box-shadow: none; }
        .btn-massive:disabled { background: var(--text-muted); opacity: 0.5; pointer-events: none; }

        /* --- LOGIN (SELECCIÓN DE RUTA) --- */
        .login-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: white; text-align: left; }
        .login-wrapper .logo-icon { width: 70px; height: 70px; font-size: 2rem; background: var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(2,132,199,0.3); align-self: flex-start; }
        
        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .nav-item { flex: 1; padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* --- RESUMEN (ARQUEO) --- */
        .arqueo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .arqueo-box { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; text-align: left; }
        .arqueo-box .val { font-size: 1.3rem; font-weight: 900; color: var(--text-main); margin-top: 5px; }

        /* Toast / Alertas */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 15px 25px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <!-- MENSAJE TOAST (Flotante) -->
    <div id="toast" class="toast"><i class="fa-solid fa-check-circle"></i> Venta Registrada</div>

    <!-- PANTALLA 1: SELECCIONAR RUTA (LOGIN) -->
    <div id="screen-login" class="screen active login-wrapper">
        <div class="logo-icon"><i class="fa-solid fa-droplet"></i></div>
        <div style="width: 100%;">
            <h1 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 5px;">AquaVita</h1>
            <p style="color: var(--text-muted); font-weight: 600; margin-bottom: 30px;">App para Choferes</p>
        </div>

        <div class="card" style="width: 100%;">
            <div class="input-group">
                <label><i class="fa-solid fa-truck"></i> Selecciona tu Unidad</label>
                <select id="flota-select" class="input-field">
                    <option value="">Cargando rutas activas...</option>
                </select>
            </div>
            <button onclick="iniciarTurno()" class="btn-massive" style="background: var(--primary);">Entrar <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <!-- HEADER DE LA APP (Visible en Venta y Arqueo) -->
    <header id="app-header" class="mobile-header" style="display: none;">
        <h1><i class="fa-solid fa-droplet" style="color: #38bdf8;"></i> AquaVita</h1>
        <div id="header-ruta" class="route-badge">Ruta 1</div>
    </header>

    <!-- PANTALLA 2: REGISTRO DE VENTA -->
    <div id="screen-venta" class="screen">
        <div class="container">
            <!-- Stock Disponible -->
            <div class="stock-card">
                <div class="stock-title"><i class="fa-solid fa-box"></i> Inventario Actual</div>
                <div class="stock-number" id="ui-stock">-- <span style="font-size: 1.1rem; font-weight: 600;">Botellones Restantes</span></div>
            </div>

            <!-- Formulario de 3 Clics -->
            <div class="card">
                <div class="input-group">
                    <label>Cliente (Opcional)</label>
                    <input type="text" id="v-cliente" class="input-field" placeholder="Ej: Cliente Casual" value="Cliente Casual">
                </div>

                <div class="input-group">
                    <label>Cantidad de Botellones</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="cambiarCant(-1)">-</button>
                        <div class="stepper-value" id="v-cant">1</div>
                        <button class="stepper-btn" onclick="cambiarCant(1)">+</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Método de Pago</label>
                    <div class="payment-grid">
                        <div class="pay-btn pay-efectivo selected" onclick="seleccionarPago(this, 'Efectivo')">
                            <i class="fa-solid fa-money-bill-wave"></i> Efectivo
                        </div>
                        <div class="pay-btn pay-qr" onclick="seleccionarPago(this, 'QR')">
                            <i class="fa-solid fa-qrcode"></i> Pago QR
                        </div>
                        <div class="pay-btn pay-transf" onclick="seleccionarPago(this, 'Transferencia')">
                            <i class="fa-solid fa-building-columns"></i> Transf.
                        </div>
                        <div class="pay-btn pay-credito" onclick="seleccionarPago(this, 'Crédito')">
                            <i class="fa-solid fa-file-invoice-dollar"></i> Crédito
                        </div>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <span style="font-size: 1rem; font-weight: 800;">Total a Cobrar:</span>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span style="font-weight: 800; font-size: 1.2rem;">Bs.</span>
                            <input type="number" id="v-total" class="input-field" style="width: 100px; padding: 10px; font-size: 1.2rem; text-align: left; border-color: var(--primary);" readonly>
                        </div>
                    </div>
                    
                    <button id="btn-registrar" class="btn-massive" onclick="registrarVenta()">
                        <i class="fa-solid fa-check"></i> Registrar Venta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: MI RESUMEN (ARQUEO) -->
    <div id="screen-arqueo" class="screen">
        <div class="container">
            <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; text-align: left;"><i class="fa-solid fa-calculator"></i> Arqueo de Caja</h2>
            
            <div class="arqueo-grid">
                <div class="arqueo-box" style="border-left: 4px solid #22c55e;">
                    <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">EFECTIVO FÍSICO</div>
                    <div class="val" id="arq-efectivo">Bs. 0</div>
                </div>
                <div class="arqueo-box" style="border-left: 4px solid #0ea5e9;">
                    <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">QR / DIGITAL</div>
                    <div class="val" id="arq-digital">Bs. 0</div>
                </div>
                <div class="arqueo-box" style="grid-column: span 2; background: var(--primary-light); border-color: var(--primary);">
                    <div style="font-size: 0.8rem; font-weight: 800; color: var(--primary-dark);">RECAUDACIÓN TOTAL HOY</div>
                    <div class="val" id="arq-total" style="font-size: 1.8rem; color: var(--primary-dark);">Bs. 0</div>
                </div>
            </div>

            <h3 style="font-size: 0.9rem; font-weight: 800; margin: 20px 0 10px 0; color: var(--text-muted); text-align: left;">VENTAS REALIZADAS HOY</h3>
            <div id="mis-ventas-lista" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <!-- Cargado con JS -->
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div id="bottom-nav" class="bottom-nav" style="display: none;">
        <div class="nav-item active" onclick="switchTab('venta', this)">
            <i class="fa-solid fa-bottle-water"></i> Vender
        </div>
        <div class="nav-item" onclick="switchTab('arqueo', this); cargarMisVentas();">
            <i class="fa-solid fa-wallet"></i> Mi Resumen
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN (SUPABASE Y PRECIOS)
        // ==========================================
        const { createClient } = supabase;
        const supabaseUrl = 'https://dyodvgdmsrsdwcgjlitv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5b2R2Z2Rtc3JzZHdjZ2psaXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODM0MTYsImV4cCI6MjEwMTM1OTQxNn0.2Q_IUGGfnWytGCv01xVhiCYPPpSolGwEvly2Pp5KOKE';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const PRECIO_BOTELLON = 15; 

        let currentFlota = null; 
        let cantidadActual = 1;
        let metodoPagoActual = 'Efectivo';

        // ==========================================
        // 1. INICIALIZACIÓN Y LOGIN
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('v-total').value = PRECIO_BOTELLON; 
            
            try {
                const { data, error } = await supabaseClient
                    .from('flota')
                    .select('id, nombre, stock_actual, choferes(nombre)')
                    .eq('estado', 'ruta')
                    .gt('stock_actual', 0)
                    .order('created_at', { ascending: false });
                
                if(error) throw error;
                
                const select = document.getElementById('flota-select');
                select.innerHTML = '<option value="">Selecciona tu unidad...</option>';
                data.forEach(f => {
                    const nombreChofer = f.choferes ? f.choferes.nombre : 'Sin chofer';
                    select.innerHTML += `<option value='${JSON.stringify(f)}'>${f.nombre} (${nombreChofer})</option>`;
                });
            } catch (error) {
                alert("Error de conexión. Intenta recargar la página.");
            }
        });

        function iniciarTurno() {
            const selectVal = document.getElementById('flota-select').value;
            if(!selectVal) return alert("Por favor, selecciona una unidad para continuar.");

            currentFlota = JSON.parse(selectVal);
            
            document.getElementById('header-ruta').innerText = currentFlota.nombre;
            document.getElementById('ui-stock').innerText = currentFlota.stock_actual;

            document.getElementById('screen-login').classList.remove('active');
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('screen-venta').classList.add('active');
        }

        // ==========================================
        // 2. LÓGICA DEL FORMULARIO DE VENTA
        // ==========================================
        
        function cambiarCant(val) {
            const nuevaCant = cantidadActual + val;
            
            if(nuevaCant < 1) return; 
            if(nuevaCant > currentFlota.stock_actual) {
                mostrarToast("⚠️ No tienes suficiente stock.", "warning");
                return;
            }

            cantidadActual = nuevaCant;
            document.getElementById('v-cant').innerText = cantidadActual;
            document.getElementById('v-total').value = cantidadActual * PRECIO_BOTELLON;
        }

        function seleccionarPago(btnElement, metodo) {
            document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
            metodoPagoActual = metodo;
        }

        async function registrarVenta() {
            const btn = document.getElementById('btn-registrar');
            const cliente = document.getElementById('v-cliente').value.trim() || 'Cliente Casual';
            const totalCosto = parseFloat(document.getElementById('v-total').value);

            if(cantidadActual > currentFlota.stock_actual) {
                return alert("No puedes vender más del stock que tienes en el camión.");
            }

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registrando...';
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('entregas').insert([{
                    flota_id: currentFlota.id,
                    cliente: cliente,
                    unidades: cantidadActual,
                    metodo_pago: metodoPagoActual,
                    total: totalCosto
                }]);

                if(error) throw error;

                currentFlota.stock_actual -= cantidadActual;
                document.getElementById('ui-stock').innerText = currentFlota.stock_actual;

                cantidadActual = 1;
                document.getElementById('v-cant').innerText = 1;
                document.getElementById('v-total').value = PRECIO_BOTELLON;
                document.getElementById('v-cliente').value = 'Cliente Casual';
                
                mostrarToast(`<i class="fa-solid fa-check"></i> Venta de Bs. ${totalCosto} registrada!`);

                if(currentFlota.stock_actual === 0) {
                    alert("¡Te quedaste sin botellones! Debes regresar a la planta a recargar.");
                }

            } catch (error) {
                alert("Error al registrar la venta. Revisa tu conexión a internet.");
                console.error(error);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Registrar Venta';
                btn.disabled = false;
            }
        }

        // ==========================================
        // 3. LÓGICA DE ARQUEO / RESUMEN
        // ==========================================
        
        async function cargarMisVentas() {
            if(!currentFlota) return;

            const listContainer = document.getElementById('mis-ventas-lista');
            listContainer.innerHTML = '<div style="text-align:left; padding: 20px; color: #64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i> Calculando arqueo...</div>';

            try {
                const hoyInicio = new Date();
                hoyInicio.setHours(0,0,0,0);

                const { data, error } = await supabaseClient
                    .from('entregas')
                    .select('*')
                    .eq('flota_id', currentFlota.id)
                    .gte('created_at', hoyInicio.toISOString())
                    .order('created_at', { ascending: false });

                if(error) throw error;

                let sumaEfectivo = 0;
                let sumaDigital = 0;
                listContainer.innerHTML = '';

                if(data.length === 0) {
                    listContainer.innerHTML = '<div style="text-align:left; color:#64748b;">Aún no tienes ventas registradas.</div>';
                }

                data.forEach(v => {
                    const monto = Number(v.total);
                    if(v.metodo_pago === 'Efectivo') { sumaEfectivo += monto; }
                    else { sumaDigital += monto; }

                    const hora = new Date(v.created_at).toLocaleTimeString('es-BO', {hour: '2-digit', minute:'2-digit'});
                    
                    listContainer.innerHTML += `
                        <div style="background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                            <div>
                                <div style="font-weight: 800; font-size: 0.9rem;">${v.cliente}</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">${hora} • ${v.unidades} unidades • ${v.metodo_pago}</div>
                            </div>
                            <div style="font-weight: 900; color: var(--text-main);">Bs. ${monto}</div>
                        </div>
                    `;
                });

                document.getElementById('arq-efectivo').innerText = `Bs. ${sumaEfectivo}`;
                document.getElementById('arq-digital').innerText = `Bs. ${sumaDigital}`;
                document.getElementById('arq-total').innerText = `Bs. ${sumaEfectivo + sumaDigital}`;

            } catch (error) {
                listContainer.innerHTML = '<div style="color:red; text-align:left;">Error cargando ventas.</div>';
            }
        }

        // ==========================================
        // UTILIDADES Y NAVEGACIÓN
        // ==========================================
        
        function switchTab(tab, btnElement) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnElement.classList.add('active');

            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(`screen-${tab}`).classList.add('active');
        }

        function mostrarToast(mensaje, tipo = "success") {
            const toast = document.getElementById('toast');
            toast.innerHTML = mensaje;
            toast.style.background = tipo === 'warning' ? '#f59e0b' : '#1f2937';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
